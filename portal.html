 return send("portal_me_submit",{kind,org:v("org"),notes:v("nt"),renew_of:v("ren"),subj:kind==="تجديد"?"تجديد الموافقة "+v("ren"):"طلب "+[...new Set(acts.map(a=>a.type||TYPES[0]))].join(" و"),acts:acts.map(a=>({type:a.type||TYPES[0],mosque:a.mosque==="other"?"":a.mosque,mosRaw:a.mosque==="other"?a.mosRaw:"",gov:a.gov||"",days:a.days||[],time:a.time,lect:a.lect||""}))},"وصل طلبكم",true)}

if(F==="ask"){if(!v("nt"))return err("اكتبوا رسالتكم");return send("portal_me_submit",{kind:"استفسار",notes:v("nt"),subj:v("nt").slice(0,80)},"وصلت رسالتكم",true,"يصلكم الرد في «المراسلات».")}
if(F==="team"){const T=team.filter(t=>t.name||t.phone);if(!T.length)return err("أضيفوا بيانات شخص واحد على الأقل");return send("portal_me_submit",{kind:"تحديث بيانات",team:T,notes:v("nt")||"تحديث بيانات المنسقين",subj:"تحديث بيانات منسقي الجالية"},"وصل التحديث للقسم",true)}
if(F==="rep")return send("portal_me_report",{period:v("rp"),lessons:+v("rl")||null,attend:+v("ra")||null,converts:+v("rc")||null,notes:v("nt2"),needs:v("rn")},"وصل التقرير","جزاكم الله خيراً على متابعتكم.",false,"er2")});

 '<div class="g2">'+field("الرمز السري للمنسق",'<input id="rg-k" type="password" inputmode="numeric" dir="ltr" maxlength="8" autocomplete="new-password" placeholder="من 4 إلى 8 أرقام">')+field("تأكيد الرمز",'<input id="rg-k2" type="password" inputmode="numeric" dir="ltr" maxlength="8" autocomplete="new-password">')+'</div>'+
 field("ملاحظات",'<input id="rg-nt" placeholder="مثال: الجهة التابعة لها، المنطقة">',1)+'<p class="err" id="er2" hidden></p>'+'<button class="btn p" type="submit">إرسال الطلب للقسم</button><button type="button" class="btn ghost" data-mode="in">لدي حساب، تسجيل الدخول</button></form>'+foot+'</div>';
 if(!COMMS)rpc("portal_comms",{}).then(c=>{COMMS=c||[];const sel=$("rg-comm");if(sel&&mode==="reg"){const v=sel.value;sel.innerHTML='<option value="">اختر الجالية</option>'+COMMS.map(x=>'<option>'+e(x)+'</option>').join("")+'<option value="__new">جالية غير موجودة في القائمة</option>';sel.value=v}}).catch(()=>{});return}
const act=mode==="act";
$("app").innerHTML='<div class="auth"><form class="card pad" data-form="login"><div><h1>'+(act?"تفعيل حساب":"تسجيل الدخول")+'</h1></div><p class="lead">'+(act?"لنائب المنسق بعد اعتماد الحساب، أو بعد إعادة تعيين الرمز من القسم: الرقم المدني ورقم الهاتف المسجّل، ثم اختيار رمز سري.":"لمنسقي الجاليات ونوابهم.")+'</p>'+
field("الرقم المدني",'<input id="lc" inputmode="numeric" dir="ltr" maxlength="12" autocomplete="username" value="'+e(LS.g("civ"))+'">')+(act?field("رقم الهاتف",'<input id="lp" inputmode="tel" dir="ltr" autocomplete="tel">'):'')+

msg+'<button class="btn p" type="submit">'+(act?"تفعيل والدخول":"دخول")+'</button>'+(act?'<button type="button" class="btn ghost" data-mode="in">رجوع لتسجيل الدخول</button>':'<button type="button" class="btn s" data-mode="reg">طلب حساب جديد</button><button type="button" class="link" data-mode="act" style="justify-self:center">نائب منسق أو أُعيد تعيين رمزك؟ فعّل حسابك</button>')+'</form><div id="pick"></div>'+foot+(act?'':'<p class="org" style="margin-top:6px">موظفو القسم: <a class="link" href="./#portal">ادخلوا من إنجاز ثم «فتح بوابتهم»</a></p>')+'</div>'}
