<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوابة المنسقين — قسم الجاليات</title><meta name="robots" content="noindex"><meta name="theme-color" content="#168A63"><link rel="icon" href="favicon-32.png">
<style>
:root{--g:#168A63;--gs:#E1F3EA;--ink:#13281F;--mu:#5C6E66;--line:#DFE8E3;--bg:#F4F8F6;--card:#fff;--bad:#B8392B}
@media (prefers-color-scheme:dark){:root{--bg:#0C1411;--card:#131E19;--ink:#E5EEE9;--mu:#97AA9F;--line:#24352C;--gs:#163528}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;line-height:1.6}
.w{max-width:640px;margin:0 auto;padding:16px 16px 40px}.hd{text-align:center;padding:18px 0 8px}.hd small{color:var(--mu);display:block}.hd b{font-size:20px;color:var(--g);display:block}.hd h1{font-size:24px;margin:8px 0 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;display:grid;gap:12px}
label{display:grid;gap:5px;font-size:13.5px;color:var(--mu);font-weight:600}input,select,textarea{font:inherit;font-size:16px;width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:14px;padding:5px}.seg button{border:0;background:none;border-radius:10px;padding:10px;font:inherit;font-weight:700;color:var(--mu)}.seg button.on{background:var(--card);color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.act{border:1px dashed var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;position:relative}.act h3{margin:0;font-size:15px}.rm{position:absolute;top:8px;left:10px;border:0;background:none;font-size:20px;color:var(--mu)}
.days{display:flex;flex-wrap:wrap;gap:6px}.days label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-weight:600;cursor:pointer}.days input{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.p{background:var(--g);color:#fff}.s{background:var(--gs);color:var(--g)}
.msg{text-align:center;padding:30px 16px}.msg b{display:block;font-size:22px;color:var(--g)}.err{color:var(--bad);font-weight:700;font-size:14px}.hint{font-size:12.5px;color:var(--mu)}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
</style></head><body><div class="w"><div class="hd"><small>وزارة الشؤون الإسلامية · إدارة العلاقات الخارجية</small><b>قسم الجاليات ورعاية المهتدين وطلبة البعوث</b><h1>بوابة المنسقين</h1><small id="cm"></small></div><div id="app"><div class="c msg">جارٍ التحميل…</div></div></div>
<script>
const U="https://nybuospfwbbtejvjivhd.supabase.co/rest/v1/rpc/",K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YnVvc3Bmd2JidGVqdmppdmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTM2NzUsImV4cCI6MjEwNzkyOTY3NX0.raSv5v4repFqwam7C7l0d5mWABVH44REq_oRfDYzgF4",TK=decodeURIComponent(location.hash.slice(1));
const rpc=(f,b)=>fetch(U+f,{method:"POST",headers:{"Content-Type":"application/json",apikey:K,Authorization:"Bearer "+K},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||"تعذّر الاتصال");return j});
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],TIMES=["بعد صلاة الفجر","بعد صلاة العصر","بعد صلاة المغرب","بين المغرب والعشاء","بعد صلاة العشاء"],TYPES=["درس ديني","محاضرة دينية","دورة علمية"];
let I=null,kind="جديد",acts=[{}];
function actHTML(a,i){const g=[...new Set(I.mosques.map(m=>m.gov).filter(Boolean))];return '<div class="act"><h3>النشاط '+(i+1)+'</h3>'+(acts.length>1?'<button class="rm" data-rm="'+i+'" type="button">×</button>':'')+
'<div class="g2"><label>نوع النشاط<select data-k="type" data-i="'+i+'">'+TYPES.map(t=>'<option'+(a.type===t?' selected':'')+'>'+t+'</option>').join("")+'</select></label><label>المحافظة<select data-k="gov" data-i="'+i+'"><option value="">اختر</option>'+g.map(x=>'<option'+(a.gov===x?' selected':'')+'>'+e(x)+'</option>').join("")+'</select></label></div>'+
'<label>المسجد<select data-k="mosque" data-i="'+i+'"><option value="">'+(a.gov?'اختر المسجد':'اختر المحافظة أولاً')+'</option>'+I.mosques.filter(m=>!a.gov||m.gov===a.gov).map(m=>'<option value="'+m.id+'"'+(a.mosque===m.id?' selected':'')+'>مسجد '+e(m.name)+(m.area?' — '+e(m.area):'')+'</option>').join("")+'<option value="other"'+(a.mosque==="other"?' selected':'')+'>مسجد غير موجود في القائمة</option></select></label>'+
(a.mosque==="other"?'<label>اسم المسجد والمنطقة<input data-k="mosRaw" data-i="'+i+'" value="'+e(a.mosRaw||"")+'"></label>':'')+
'<label>الأيام</label><div class="days">'+DAYS.map((d,j)=>'<label><input type="checkbox" data-day="'+j+'" data-i="'+i+'"'+((a.days||[]).includes(j)?' checked':'')+'>'+d+'</label>').join("")+'</div>'+
'<div class="g2"><label>الوقت<select data-k="time" data-i="'+i+'"><option value="">اختر</option>'+TIMES.map(t=>'<option'+(a.time===t?' selected':'')+'>'+t+'</option>').join("")+'</select></label><label>اسم المحاضر<input data-k="lect" data-i="'+i+'" value="'+e(a.lect||"")+'"></label></div>'+
'<label>عنوان النشاط (اختياري)<input data-k="title" data-i="'+i+'" value="'+e(a.title||"")+'"></label></div>'}
function draw(){const app=document.getElementById("app");app.innerHTML='<form id="f"><div class="c"><div class="seg"><button type="button" data-kind="جديد" class="'+(kind==="جديد"?"on":"")+'">طلب جديد</button><button type="button" data-kind="تجديد" class="'+(kind==="تجديد"?"on":"")+'">تجديد موافقة</button></div>'+
(kind==="تجديد"?'<label>الموافقة المراد تجديدها<select id="ren"><option value="">اختر</option>'+I.approvals.map(a=>'<option value="'+e(a.no)+'">'+e(a.no)+' — تنتهي '+e(a.end.split("-").reverse().join("/"))+'</option>').join("")+'</select></label>':'')+
'<div class="g2"><label>اسمك<input id="co" required autocomplete="name"></label><label>رقم هاتفك<input id="ph" inputmode="tel" dir="ltr" required></label></div><label>الجهة (اختياري)<input id="org" placeholder="مثال: لجنة/مركز/جمعية"></label></div>'+
'<div class="c">'+acts.map(actHTML).join("")+'<button type="button" class="btn s" id="add">+ إضافة نشاط آخر</button></div>'+
'<div class="c"><label>ملاحظات<textarea id="nt" rows="3"></textarea></label><p class="err" id="er" hidden></p><button class="btn p" type="submit" id="go">إرسال الطلب</button><span class="hint">يصل طلبك مباشرة لقسم الجاليات، وتصلك الإفادة على رقمك.</span></div></form>'}
document.addEventListener("click",ev=>{const t=ev.target.closest("button");if(!t)return;if(t.dataset.kind){keep();kind=t.dataset.kind;draw();restore()}if(t.id==="add"){keep();acts.push({});draw();restore()}if(t.dataset.rm){keep();acts.splice(+t.dataset.rm,1);draw();restore()}});
let saved={};function keep(){for(const id of["co","ph","org","nt","ren"]){const x=document.getElementById(id);if(x)saved[id]=x.value}}function restore(){for(const id in saved){const x=document.getElementById(id);if(x)x.value=saved[id]}}
document.addEventListener("change",ev=>{const t=ev.target,i=t.dataset.i;if(i===undefined)return;const a=acts[+i];if(t.dataset.day!==undefined){const d=+t.dataset.day;a.days=a.days||[];a.days=t.checked?[...new Set([...a.days,d])]:a.days.filter(x=>x!==d);return}a[t.dataset.k]=t.value;if(t.dataset.k==="gov"||t.dataset.k==="mosque"){keep();draw();restore()}});
document.addEventListener("input",ev=>{const t=ev.target,i=t.dataset.i;if(i!==undefined&&t.dataset.k)acts[+i][t.dataset.k]=t.value});
document.addEventListener("submit",async ev=>{ev.preventDefault();const v=id=>(document.getElementById(id)?.value||"").trim(),er=document.getElementById("er");er.hidden=true;
const bad=acts.findIndex(a=>!(a.mosque&&(a.mosque!=="other"||a.mosRaw))||!(a.days||[]).length||!a.time);if(!v("co")||!v("ph"))return show("اكتب اسمك ورقم هاتفك");if(bad>=0)return show("أكمل بيانات النشاط "+(bad+1)+": المسجد والأيام والوقت");if(kind==="تجديد"&&!v("ren"))return show("اختر الموافقة المراد تجديدها");
function show(m){er.textContent=m;er.hidden=false}
const b=document.getElementById("go");b.disabled=true;b.textContent="جارٍ الإرسال…";
try{const r=await rpc("portal_submit",{p_token:TK,p:{kind,coord:v("co"),phone:v("ph"),org:v("org"),notes:v("nt"),renew_of:v("ren"),subj:(kind==="تجديد"?"طلب تجديد موافقة "+v("ren"):"طلب "+[...new Set(acts.map(a=>a.type||"درس ديني"))].join(" و"))+" — "+I.comm,acts:acts.map(a=>({type:a.type||"درس ديني",mosque:a.mosque==="other"?"":a.mosque,mosRaw:a.mosque==="other"?a.mosRaw:"",gov:a.gov||"",days:a.days||[],time:a.time,lect:a.lect||"",title:a.title||""}))}});
document.getElementById("app").innerHTML='<div class="c msg"><b>✓ تم استلام طلبكم</b>رقم الطلب: <strong>ط-'+r.no+'</strong><br>سيتواصل معكم القسم قريباً بإذن الله.</div>'}catch(x){b.disabled=false;b.textContent="إرسال الطلب";show(x.message)}});
(async()=>{try{I=await rpc("portal_info",{p_token:TK});if(!I.ok)throw 0;document.getElementById("cm").textContent="الجالية: "+I.comm;draw()}catch(_){document.getElementById("app").innerHTML='<div class="c msg"><b style="color:var(--bad)">الرابط غير صالح</b>تواصل مع قسم الجاليات للحصول على الرابط الصحيح.</div>'}})();
</script></body></html>
