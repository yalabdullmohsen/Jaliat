<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تذكير البصمة</title>
<meta name="theme-color" content="#1E3A31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البصمة">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* هوية إنجاز «عاجي ملكي»: عاجي + أخضر ملكي + ذهبي. عمود واحد: شريط علوي، زر/البصمة القادمة، القائمة، الإعدادات مطوية. */
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --surface-2:#F2F1EC; --ink:#1F2A25; --muted:#6C7872; --line:#E6E3DB;
  --primary:#2F6B57; --primary-ink:#FFFFFF; --primary-soft:#E9F1ED;
  --gold:#957631; --gold-soft:#F5EFE0; --bad:#B0564A; --bads:#F7E9E6;
  --side:#1E3A31; --side-ink:#F2F6F4; --side-muted:#B9CCC3;
  --shadow:0 1px 2px rgba(31,42,37,.04),0 6px 20px rgba(31,42,37,.05);
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614; --surface:#181E1B; --surface-2:#1E2522; --ink:#E2E8E5; --muted:#97A39D; --line:#28302C;
  --primary:#74B398; --primary-ink:#0D1512; --primary-soft:#1E2C26;
  --gold:#D3B46C; --gold-soft:#2A2517; --bad:#E39488; --bads:#2E1D1A;
  --side:#0F1513; --side-ink:#E2E8E5; --side-muted:#97A39D;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}

.top{background:var(--side);color:var(--side-ink);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:16px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top img{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 1px rgba(211,180,108,.45)}
.top h1{margin:0;font-size:1.2rem;font-weight:700;line-height:1.3}
.top .d{font-size:.85rem;color:var(--side-muted)}

.wrap{max-width:480px;margin:0 auto;padding-block:18px 32px;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.note{background:var(--gold-soft);border:0;box-shadow:none;font-size:.92rem}
.note b{display:block;margin-bottom:4px}

/* الزر الرئيسي */
.go{width:100%;border:0;border-radius:14px;background:var(--primary);color:var(--primary-ink);
  padding:22px 16px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:1.25rem;font-weight:700;
  box-shadow:0 8px 22px -10px color-mix(in srgb,var(--primary) 70%,transparent);transition:transform .1s,opacity .1s}
.go:active{transform:scale(.98)} .go:disabled{opacity:.6}
.go svg{width:30px;height:30px;flex:none}
.alt{display:flex;justify-content:center}
.link{background:none;border:0;color:var(--primary);font-weight:600;font-size:.92rem;padding:6px}
.pick{display:flex;gap:8px;align-items:center;justify-content:center}
.pick input{font:600 1rem var(--f);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:600;background:var(--primary);color:var(--primary-ink)}

/* البصمة القادمة */
.next{text-align:center;padding:20px 16px}
.next .lbl{font-size:.9rem;color:var(--muted)}
.next .big{font-size:2.6rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;margin:2px 0}
.next .cd{display:inline-block;font-size:.88rem;font-weight:600;padding:3px 12px;border-radius:999px}
.next.taw .big{color:var(--gold)} .next.taw .cd{background:var(--gold-soft);color:var(--gold)}
.next.out .big{color:var(--bad)} .next.out .cd{background:var(--bads);color:var(--bad)}
.next.end .big{color:var(--primary);font-size:1.6rem}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .k{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.r-in .dot{background:var(--primary)} .r-taw .dot{background:var(--gold)} .r-out .dot{background:var(--bad)}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.row.done .v{color:var(--muted);font-weight:500}
.row.done .k::after{content:"✓";color:var(--primary);font-size:.85rem}
.tools{display:flex;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.tools .link.mute{color:var(--muted)}

details.card{padding:0}
summary{list-style:none;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(135deg)}
.set{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f > span{font-size:.88rem;font-weight:600;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rule{font-size:.82rem;color:var(--muted);margin:0}

#toast{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);
  background:var(--side);color:var(--side-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;text-align:center;
  opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <img src="icon-180.png" alt="">
  <div><h1>تذكير البصمة</h1><div class="d" id="today"></div></div>
</div></header>

<main class="wrap">
  <div class="card note" id="note" hidden></div>

  <!-- قبل الدخول -->
  <section id="start">
    <button class="go" id="go" type="button">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true">
        <path d="M14 36c2-4 3-8 3-12a7 7 0 0 1 14 0c0 5-1 10-3 14"/><path d="M24 24c0 6-1.5 11-4 16"/><path d="M9 30c1-2 1.5-4 1.5-6a13.5 13.5 0 0 1 27 0c0 3-.3 6-1 9"/><path d="M12 13a17 17 0 0 1 24 0"/>
      </svg>
      بصمت دخول
    </button>
    <div class="alt"><button class="link" id="showPick" type="button">بصمت بوقت ثاني؟</button></div>
    <div class="pick" id="pick" hidden>
      <input type="time" id="entryTime" aria-label="وقت بصمة الدخول">
      <button class="btn" id="goAt" type="button">اعتمد</button>
    </div>
  </section>

  <!-- بعد الدخول -->
  <section id="day" hidden>
    <div class="card next" id="next">
      <div class="lbl" id="nLbl"></div>
      <div class="big" id="nTime"></div>
      <span class="cd" id="nCd"></span>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="rows">
        <div class="row r-in done"><span class="k"><i class="dot"></i>الدخول</span><span class="v" id="tIn"></span></div>
        <div class="row r-taw" id="rTaw"><span class="k"><i class="dot"></i>التواجد</span><span class="v" id="tTaw"></span></div>
        <div class="row r-out" id="rOut"><span class="k"><i class="dot"></i>الخروج</span><span class="v" id="tOut"></span></div>
      </div>
      <div class="tools">
        <button class="link" id="redo" type="button">تعديل وقت الدخول</button>
        <button class="link mute" id="cancel" type="button">إلغاء التذكيرات</button>
      </div>
    </div>
  </section>

  <details class="card">
    <summary>الإعدادات</summary>
    <div class="set">
      <div class="f"><span>نوع الدوام</span>
        <div class="seg" data-k="type">
          <button type="button" data-v="reg">صباحي</button>
          <button type="button" data-v="start">تخفيف بداية</button>
          <button type="button" data-v="end">تخفيف نهاية</button>
        </div>
      </div>
      <div class="f"><span>الموظف</span>
        <div class="seg" data-k="g">
          <button type="button" data-v="m">رجل</button>
          <button type="button" data-v="f">امرأة</button>
        </div>
      </div>
      <div class="f"><span>التواجد بعد الدخول بـ</span>
        <div class="seg" data-k="taw">
          <button type="button" data-v="90">1:30</button>
          <button type="button" data-v="120">2:00</button>
          <button type="button" data-v="150">2:30</button>
          <button type="button" data-v="180">3:00</button>
        </div>
      </div>
      <p class="rule" id="rule"></p>
      <button class="link" id="test" type="button" style="align-self:flex-start;padding-inline:0">جرّب إشعار الحين</button>
    </div>
  </details>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const FN = 'https://nybuospfwbbtejvjivhd.supabase.co/functions/v1/basma-push';
const VAPID = 'BJZYI6bVtmUno0pnZ6UZKPMccwwvtw9AsbXhz7lY-FL_aTDaJSi9dEn0hE1rma4NDqpNOdCAQwEZ1vbCVtAXhgw';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('basma.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('basma.' + k, JSON.stringify(v)); } catch {} },
};
const settings = Object.assign({ type: 'reg', g: 'm', taw: 120 }, store.get('settings', {}));

// قواعد الدوام الصباحي (القرار الوزاري 2023/273) — الدقائق من منتصف الليل
function exitMinutes(e, g, type) {
  const full = g === 'f' ? 375 : 390, red = g === 'f' ? 285 : 300;
  if (type === 'start') { e = Math.min(Math.max(e, 540), 570); return e + red; }
  if (type === 'end')   { e = Math.min(Math.max(e, 420), 450); return e + red; }
  if (e < 420) e = 420;
  if (e <= 540) return e + full;
  return g === 'f' ? 945 : 960;
}
const RULES = {
  reg: g => `دخول 7:00–9:00، والخروج بعد ${g === 'f' ? '6:15' : '6:30'} ساعة. بعد 9:00 الخروج ${g === 'f' ? '3:45' : '4:00'} م.`,
  start: g => `دخول 9:00–9:30، والخروج بعد ${g === 'f' ? '4:45' : '5:00'} ساعات.`,
  end: g => `دخول 7:00–7:30، والخروج بعد ${g === 'f' ? '4:45' : '5:00'} ساعات.`,
};

const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function fmt(m) { m = ((m % 1440) + 1440) % 1440; let h = Math.floor(m / 60); const mi = m % 60, ap = h < 12 ? 'ص' : 'م'; h = h % 12 || 12; return `${h}:${pad(mi)} ${ap}`; }
function atToday(m) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setMinutes(m); return d; }
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const hrs = h => h === 1 ? 'ساعة' : h === 2 ? 'ساعتين' : h <= 10 ? `${h} ساعات` : `${h} ساعة`;
const mins = r => r === 1 ? 'دقيقة' : r === 2 ? 'دقيقتين' : r <= 10 ? `${r} دقائق` : `${r} دقيقة`;
function left(ms) { const m = Math.max(1, Math.ceil(ms / 60000)), h = Math.floor(m / 60), r = m % 60; return 'بعد ' + (h ? hrs(h) + (r ? ' و' + mins(r) : '') : mins(r)); }

let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); }
function note(html) { $('note').innerHTML = html; $('note').hidden = !html; }

const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const INSTALL = '<b>خطوة وحدة قبل أول استخدام</b>من سفاري اضغط زر المشاركة ← «إضافة إلى الشاشة الرئيسية»، ثم افتح «البصمة» من الشاشة الرئيسية.';
const DENIED = '<b>الإشعارات مقفلة</b>الإعدادات ← الإشعارات ← البصمة، وفعّل السماح.';

let reg = null;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './' }).then(r => reg = r).catch(() => {});
function b64ToBytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function getSub() {
  if (!pushOK) throw new Error(isIOS && !standalone ? 'install' : 'unsupported');
  if (Notification.permission === 'denied') throw new Error('denied');
  if (Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted') throw new Error('denied');
  const r = reg || await navigator.serviceWorker.ready;
  const s = await r.pushManager.getSubscription() || await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID) });
  return s.toJSON();
}
async function call(body) {
  const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'server');
  return j;
}
function fail(e) {
  const m = e && e.message;
  if (m === 'install') { note(INSTALL); toast('أضفه للشاشة الرئيسية أول'); }
  else if (m === 'denied') { note(DENIED); toast('لازم تسمح بالإشعارات'); }
  else if (m === 'unsupported') toast('هذا المتصفح ما يدعم الإشعارات');
  else toast('ما انحفظ، تأكد من الإنترنت وجرّب مرة ثانية');
}

async function punch(entry, quiet) {
  const p = { day: dayKey(new Date()), entry, taw: entry + Number(settings.taw), out: exitMinutes(entry, settings.g, settings.type) };
  $('go').disabled = $('goAt').disabled = true;
  try {
    const sub = await getSub(), now = Date.now(), items = [];
    if (atToday(p.taw) > now) items.push({ kind: 'taw', due_at: atToday(p.taw).toISOString(), title: 'بصمة التواجد', body: `حان وقت بصمة التواجد ${fmt(p.taw)}` });
    if (atToday(p.out - 10) > now) items.push({ kind: 'out-pre', due_at: atToday(p.out - 10).toISOString(), title: 'باقي 10 دقائق على الخروج', body: `بصمة الخروج ${fmt(p.out)}` });
    if (atToday(p.out) > now) items.push({ kind: 'out', due_at: atToday(p.out).toISOString(), title: 'بصمة الخروج', body: `حان وقت بصمة الخروج ${fmt(p.out)}` });
    await call({ action: 'schedule', sub, items });
    store.set('plan', p); $('pick').hidden = true; note('');
    render();
    if (!quiet) toast('تم ✓ بنذكّرك في وقتها');
  } catch (e) { fail(e); }
  finally { $('go').disabled = $('goAt').disabled = false; }
}

function render() {
  const p = store.get('plan', null), has = p && p.day === dayKey(new Date());
  $('start').hidden = !!has; $('day').hidden = !has;
  if (!has) return;
  const n = nowMin(), ms = Date.now();
  $('tIn').textContent = fmt(p.entry); $('tTaw').textContent = fmt(p.taw); $('tOut').textContent = fmt(p.out);
  $('rTaw').classList.toggle('done', n >= p.taw); $('rOut').classList.toggle('done', n >= p.out);
  const box = $('next'); box.className = 'card next';
  if (n < p.taw) { box.classList.add('taw'); $('nLbl').textContent = 'بصمة التواجد'; $('nTime').textContent = fmt(p.taw); $('nCd').textContent = left(atToday(p.taw) - ms); $('nCd').hidden = false; }
  else if (n < p.out) { box.classList.add('out'); $('nLbl').textContent = 'بصمة الخروج'; $('nTime').textContent = fmt(p.out); $('nCd').textContent = left(atToday(p.out) - ms); $('nCd').hidden = false; }
  else { box.classList.add('end'); $('nLbl').textContent = 'انتهى دوام اليوم'; $('nTime').textContent = 'الله يعطيك العافية'; $('nCd').hidden = true; }
}

function applySettings() {
  document.querySelectorAll('.seg').forEach(s => s.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(String(settings[s.dataset.k]) === b.dataset.v))));
  $('rule').textContent = RULES[settings.type](settings.g);
}
document.querySelectorAll('.seg').forEach(s => s.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  settings[s.dataset.k] = s.dataset.k === 'taw' ? Number(b.dataset.v) : b.dataset.v;
  store.set('settings', settings); applySettings();
  const p = store.get('plan', null);
  if (p && p.day === dayKey(new Date())) punch(p.entry, true).then(() => toast('حدّثت الأوقات'));
}));

$('go').addEventListener('click', () => punch(nowMin()));
$('showPick').addEventListener('click', () => { const d = new Date(); $('entryTime').value = `${pad(d.getHours())}:${pad(d.getMinutes())}`; $('pick').hidden = false; $('entryTime').focus(); });
$('goAt').addEventListener('click', () => {
  const v = $('entryTime').value; if (!v) return toast('اختر وقت الدخول');
  const [h, m] = v.split(':').map(Number); punch(h * 60 + m);
});
$('redo').addEventListener('click', () => {
  const p = store.get('plan', null);
  $('entryTime').value = p ? `${pad(Math.floor(p.entry / 60))}:${pad(p.entry % 60)}` : '';
  $('start').hidden = false; $('day').hidden = true; $('pick').hidden = false; $('entryTime').focus();
});
$('cancel').addEventListener('click', async () => {
  try {
    if (pushOK) { const r = reg || await navigator.serviceWorker.ready, s = await r.pushManager.getSubscription(); if (s) await call({ action: 'cancel', endpoint: s.endpoint }); }
    store.set('plan', null); render(); toast('ألغيت تذكيرات اليوم');
  } catch { toast('ما قدرت ألغي، جرّب مرة ثانية'); }
});
$('test').addEventListener('click', async () => {
  try { const sub = await getSub(); await call({ action: 'test', sub }); toast('أُرسل إشعار تجربة'); } catch (e) { fail(e); }
});

$('today').textContent = new Intl.DateTimeFormat('ar-KW-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
if (isIOS && !standalone) note(INSTALL);
else if (pushOK && Notification.permission === 'denied') note(DENIED);
applySettings(); render();
setInterval(render, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
</body>
</html>
