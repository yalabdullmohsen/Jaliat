name: tts
on:
  push:
    branches: [tts-work]
    paths: [lines.json, gen.py]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts
      - run: python gen.py && ls -la out/*
      - run: |
          git config user.name tts-bot && git config user.email tts@users.noreply.github.com
          git add out && git commit -m "tts audio" && git push
