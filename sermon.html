<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تأكيد خطبة الجمعة — قسم الجاليات</title><meta name="robots" content="noindex"><link rel="icon" href="favicon-32.png"><meta name="theme-color" content="#2F6B57">
<style>
:root{--g:#2F6B57;--gs:#E9F1ED;--bad:#B0564A;--ink:#1F2A25;--mu:#6C7872;--line:#E6E3DB;--bg:#F5F4F0;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111614;--card:#181E1B;--ink:#E2E8E5;--mu:#97A39D;--line:#28302C;--gs:#1E2C26;--g:#74B398}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:24px;display:grid;gap:14px}
.org{text-align:center;font-size:13px;color:var(--mu)}.org b{display:block;color:var(--g);font-size:15px}
h1{font-size:20px;margin:0;text-align:center}.who{text-align:center}.who b{font-size:18px;display:block}.who span{color:var(--mu)}
.go{border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;background:var(--g);color:#fff;cursor:pointer}.go:disabled{opacity:.6}
.m{text-align:center;font-weight:700}.ok{color:var(--g)}.no{color:var(--bad)}
.h{font-size:13px;color:var(--mu);text-align:center}.h b{color:var(--ink)}
</style><link rel="stylesheet" href="brand/ui.css?v=1"></head><body><main class="card"><div class="org">وزارة الشؤون الإسلامية · إدارة العلاقات الخارجية<b>قسم الجاليات ورعاية المهتدين وطلبة البعوث</b></div>
<h1>تأكيد خطبة الجمعة</h1><div id="a"><p class="m">جارٍ التحميل…</p></div></main>
<script>
const U="https://nybuospfwbbtejvjivhd.supabase.co/rest/v1/rpc/",K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YnVvc3Bmd2JidGVqdmppdmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTM2NzUsImV4cCI6MjEwNzkyOTY3NX0.raSv5v4repFqwam7C7l0d5mWABVH44REq_oRfDYzgF4",TK=decodeURIComponent(location.hash.slice(1));
const rpc=(f,b)=>fetch(U+f,{method:"POST",headers:{"Content-Type":"application/json",apikey:K,Authorization:"Bearer "+K},body:JSON.stringify(b)}).then(r=>r.json());
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),f=d=>String(d||"").split("-").reverse().join("/");
(async()=>{const a=document.getElementById("a");try{const I=await rpc("sermon_info",{p_token:TK});if(!I.ok)throw 0;
const dw=new Date().getDay(),open=dw===5||dw===6;
a.innerHTML='<div class="who"><b>'+e(I.name)+'</b><span>مسجد '+e(I.mosque)+(I.area?' — '+e(I.area):'')+'</span></div>'+(open?'<button class="go" id="go">أؤكد أنني ألقيت خطبة الجمعة اليوم</button>':'<p class="m">التأكيد متاح يوم الجمعة بعد الخطبة، أو يوم السبت.</p>')+'<p class="m" id="m"></p>'+(I.done.length?'<p class="h">خطبك المسجّلة: <b>'+I.done.slice(0,6).map(f).join("، ")+'</b></p>':'');
const b=document.getElementById("go");if(b)b.onclick=async()=>{b.disabled=true;b.textContent="جارٍ التسجيل…";const m=document.getElementById("m");try{const r=await rpc("sermon_confirm",{p_token:TK});m.className="m "+(r.ok?"ok":"no");m.textContent=r.msg||"تم";b.textContent=r.ok?"✓ تم التأكيد":"أؤكد أنني ألقيت خطبة الجمعة اليوم";if(!r.ok)b.disabled=false}catch(_){m.className="m no";m.textContent="تعذّر الاتصال، أعد المحاولة";b.disabled=false;b.textContent="أؤكد أنني ألقيت خطبة الجمعة اليوم"}}}
catch(_){a.innerHTML='<p class="m no">الرابط غير صالح — تواصل مع قسم الجاليات</p>'}})();
</script></body></html>
