<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>التحقق من تصريح درس — إنجاز</title><meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<style>
:root{--g:#2F6B57;--gs:#E9F1ED;--bad:#B0564A;--bads:#F7E9E6;--w:#946E1F;--ws:#F7F0E1;--ink:#1F2A25;--mu:#6C7872;--bg:#F5F4F0}
@media (prefers-color-scheme:dark){:root{--bg:#0C1411;--ink:#E5EEE9;--mu:#97AA9F;--gs:#163528;--bads:#3A1A16;--ws:#33290F}body .card{background:#131E19;border-color:#24352C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:#fff;border:1px solid #DFE8E3;border-radius:18px;max-width:440px;width:100%;padding:24px;box-shadow:0 8px 30px rgba(20,70,50,.08)}
.org{text-align:center;font-size:13px;color:var(--mu);line-height:1.6}.org b{display:block;color:var(--g);font-size:15px}
.st{margin:18px 0;border-radius:14px;padding:18px;text-align:center}.st b{display:block;font-size:24px}.st span{font-size:14px}
.ok{background:var(--gs);color:var(--g)}.no{background:var(--bads);color:var(--bad)}.ex{background:var(--ws);color:var(--w)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:15px}dt{color:var(--mu)}dd{margin:0;font-weight:600}
.im{margin-top:18px;border-top:1px solid #E6E3DB;padding-top:16px;display:grid;gap:10px}.im h3{margin:0;font-size:16px}.im label{display:grid;gap:4px;font-size:13px;color:var(--mu);font-weight:600}.im input,.im textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #E6E3DB;border-radius:12px;width:100%;background:transparent;color:var(--ink)}.yn{display:grid;grid-template-columns:1fr 1fr;gap:6px}.yn button{border:1px solid #E6E3DB;background:transparent;border-radius:12px;padding:10px;font:inherit;font-weight:700;color:var(--ink)}.yn .on{background:var(--g);color:#fff;border-color:var(--g)}.go{border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;font-size:16px;background:var(--g);color:#fff}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}
</style><link rel="stylesheet" href="brand/ui.css?v=1"></head><body><main class="card"><div class="org">دولة الكويت — وزارة الشؤون الإسلامية<b>قسم الجاليات ورعاية المهتدين وطلبة البعوث</b>التحقق من تصريح إلقاء درس</div>
<div id="r"><div class="st"><span>جارٍ التحقق…</span></div></div><div class="ft">نظام «إنجاز»</div></main>
<script>function pt(t){t=String(t||"").replace(/\s+/g," ").trim();return!t||/^(طلب|موافقة|كتاب)(\s|$|[\(:\-–])/.test(t)||/(تجديد|إقامة|اقامة|إيقاف|تعديل)\s+(دروس|أنشطة|انشطة|نشاط)/.test(t)||/^(درس|دروس|محاضرة|دورة|نشاط)$/.test(t)?"درس ديني":t}

(async()=>{const r=document.getElementById("r");const h=decodeURIComponent(location.hash.slice(1)).split(".");const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=d=>d?d.split("-").reverse().join("/"):"";
if(h.length<2){r.innerHTML='<div class="st no"><b>رابط غير صالح</b><span>امسح الباركود من التصريح الأصلي</span></div>';return}
try{const res=await fetch("https://nybuospfwbbtejvjivhd.supabase.co/rest/v1/rpc/verify_permit",{method:"POST",headers:{"Content-Type":"application/json",apikey:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YnVvc3Bmd2JidGVqdmppdmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTM2NzUsImV4cCI6MjEwNzkyOTY3NX0.raSv5v4repFqwam7C7l0d5mWABVH44REq_oRfDYzgF4",Authorization:"Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YnVvc3Bmd2JidGVqdmppdmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTM2NzUsImV4cCI6MjEwNzkyOTY3NX0.raSv5v4repFqwam7C7l0d5mWABVH44REq_oRfDYzgF4"},body:JSON.stringify({p_id:h[0],p_code:h[1]})});
const d=await res.json();if(!res.ok||!d||!d.found){r.innerHTML='<div class="st no"><b>✕ التصريح غير موجود</b><span>هذا التصريح غير صادر من القسم، لا يُسمح بإقامة الدرس</span></div>';return}
const PT=dt=>{const lat=29.3759,lng=47.9774,tz=3,R=Math.PI/180,sn=x=>Math.sin(x*R),cs=x=>Math.cos(x*R),tn=x=>Math.tan(x*R),as=x=>Math.asin(x)/R,ac=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R,at2=(y,x)=>Math.atan2(y,x)/R,fx=(a,b)=>{a-=b*Math.floor(a/b);return a<0?a+b:a};
let Y=dt.getFullYear(),M=dt.getMonth()+1;const D0=dt.getDate();if(M<=2){Y--;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4),jd=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+D0+B-1524.5-lng/360;
const sun=t=>{const D=jd-2451545+t,g=fx(357.529+.98560028*D,360),q=fx(280.459+.98564736*D,360),L=fx(q+1.915*sn(g)+.02*sn(2*g),360),ee=23.439-.00000036*D,RA=fx(at2(cs(ee)*sn(L),cs(L))/15,24);return{d:as(sn(ee)*sn(L)),q:q/15-RA}};
const mid=t=>fx(12-sun(t).q,24),ang=(a,t,ccw)=>{const d=sun(t).d,T=ac((-sn(a)-sn(d)*sn(lat))/(cs(d)*cs(lat)))/15;return mid(t)+(ccw?-T:T)},asr=t=>{const d=sun(t).d;return ang(-Math.atan(1/(1+tn(Math.abs(lat-d))))/R,t)};
const k=h=>(h+tz-lng/15)*60;return{fajr:k(ang(18,5/24,1)),sunrise:k(ang(.833,6/24,1)),dhuhr:k(mid(.5)),asr:k(asr(13/24)),maghrib:k(ang(.833,18/24)),isha:k(ang(17.5,18/24))}};
const hm=m=>{m=Math.round(m);let h=Math.floor(m/60)%24,mi=m%60;const pm=h>=12;h=h%12||12;return h+":"+String(mi).padStart(2,"0")+(pm?" م":" ص")};
const DN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],ORD=[6,0,1,2,3,4,5];
const nowK=d.now?new Date(d.now):new Date(Date.now()+(new Date().getTimezoneOffset()+180)*6e4),nm=nowK.getHours()*60+nowK.getMinutes(),P=PT(nowK);
const W={"بعد صلاة الفجر":[P.fajr,P.sunrise],"بعد صلاة الظهر":[P.dhuhr,P.asr],"بعد صلاة الجمعة":[P.dhuhr,P.asr],"بعد صلاة العصر":[P.asr,P.maghrib],"بعد صلاة المغرب":[P.maghrib,P.isha],"بين المغرب والعشاء":[P.maghrib,P.isha],"بعد صلاة العشاء":[P.isha,P.isha+120]}[d.prayer];
const win=W?[W[0]-20,W[1]+15]:null,inWin=!win||(nm>=win[0]&&nm<=win[1]),days=Array.isArray(d.days)&&d.days.length?d.days:null,dtxt=days?(days.length===7?"يومياً":ORD.filter(x=>days.includes(x)).map(x=>DN[x]).join(" و")):"";
const st=d.revoked?['no','✕ التصريح ملغى','أُلغي هذا التصريح من القسم، لا يُسمح بإقامة الدرس']:!d.valid?['ex','✕ التصريح منتهي','انتهت مدته في '+f(d.until)+'، لا يُسمح بإقامة الدرس']:d.started===false?['ex','⏳ لم يبدأ بعد','يبدأ العمل بالتصريح من '+f(d.date)]:d.day_ok===false?['ex','⏳ ليس اليوم','الدرس مسموح '+(dtxt&&dtxt!=="يومياً"?"يوم "+dtxt:dtxt)+' فقط، لا يُسمح بإقامته اليوم']:!inWin?['ex','⏳ ليس في وقته الآن','مسموح اليوم '+e(d.prayer||"")+' من '+hm(win[0])+' إلى '+hm(win[1])+' فقط']:['ok','✓ مسموح الآن','يُسمح بإقامة الدرس الآن وفق البيانات أدناه'+(win?' (حتى '+hm(win[1])+')':'')];
r.innerHTML='<div class="st '+st[0]+'"><b>'+st[1]+'</b><span>'+st[2]+'</span></div><dl><dt>رقم التصريح</dt><dd>'+e(d.no)+'</dd><dt>الشيخ</dt><dd>'+e(d.sheikh)+'</dd><dt>المسجد</dt><dd>'+e(d.mosque)+'</dd>'+'<dt>الدرس</dt><dd>'+e(pt(d.topic))+'</dd>'+'<dt>التاريخ</dt><dd>'+e(f(d.date))+'</dd><dt>الوقت</dt><dd>'+e(d.time)+'</dd><dt>ساري حتى</dt><dd>'+e(f(d.until))+'</dd><dt>المعتمِد</dt><dd>'+e(d.head)+'</dd></dl>';if(d.valid&&!d.revoked&&d.day_ok!==false&&d.started!==false){const L=k=>{try{return localStorage.getItem(k)||""}catch(_){return""}};let held=true;
r.insertAdjacentHTML("beforeend",'<form class="im" id="im"><h3>تقرير إمام المسجد</h3><span style="font-size:13px;color:var(--mu)">أكّد إقامة الدرس اليوم، واكتب ما يلزم عن الحلقات والدروس في المسجد، فيصل مباشرة لقسم الجاليات.</span><div class="g2"><label>اسم الإمام<input id="in" value="'+e(L("imam-n"))+'" required></label><label>رقم الهاتف<input id="ip" inputmode="tel" dir="ltr" value="'+e(L("imam-p"))+'" required></label></div><div class="yn"><button type="button" class="on" data-h="1">أُقيم الدرس اليوم</button><button type="button" data-h="0">لم يُقم</button></div><label>عدد الحضور (تقريباً)<input id="ia" inputmode="numeric" dir="ltr"></label><label>ملاحظات عن الحلقات والدروس أو ما حدث في المسجد<textarea id="it" rows="3"></textarea></label><button class="go" id="isb">إرسال التقرير</button><span id="ims" style="font-size:14px;font-weight:700"></span></form>');
document.querySelectorAll("#im [data-h]").forEach(b=>b.onclick=()=>{held=b.dataset.h==="1";document.querySelectorAll("#im [data-h]").forEach(x=>x.classList.toggle("on",x===b))});
document.getElementById("im").onsubmit=async ev=>{ev.preventDefault();const v=id=>document.getElementById(id).value.trim(),m=document.getElementById("ims"),b=document.getElementById("isb");if(!v("in")||!v("ip")){m.textContent="اكتب اسمك ورقم هاتفك";return}
try{localStorage.setItem("imam-n",v("in"));localStorage.setItem("imam-p",v("ip"))}catch(_){}b.disabled=true;b.textContent="جارٍ الإرسال…";
try{const K2=document.querySelector("script").textContent.match(/apikey:"([^"]+)"/)[1];const x=await fetch("https://nybuospfwbbtejvjivhd.supabase.co/rest/v1/rpc/permit_checkin",{method:"POST",headers:{"Content-Type":"application/json",apikey:K2,Authorization:"Bearer "+K2},body:JSON.stringify({p_id:h[0],p_code:h[1],p_imam:v("in"),p_phone:v("ip"),p_held:held,p_attend:+v("ia")||null,p_note:v("it")||null})});const j=await x.json();m.style.color=j.ok?"var(--g)":"var(--bad)";m.textContent=j.msg||(x.ok?"تم":"تعذّر الإرسال");if(j.ok)b.textContent="✓ وصل التقرير";else{b.disabled=false;b.textContent="إرسال التقرير"}}catch(_){b.disabled=false;b.textContent="إرسال التقرير";m.textContent="تعذّر الاتصال"}}}}
catch(_){r.innerHTML='<div class="st ex"><b>تعذّر الاتصال</b><span>تحقق من الإنترنت ثم أعد المسح</span></div>'}})();
</script></body></html>
