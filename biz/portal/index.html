<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوابة العملاء</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E3A31">
<link rel="icon" type="image/png" href="../../brand/bawaba-64.png">
<link rel="apple-touch-icon" href="../../brand/bawaba-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#0B0B0F; --muted:#6B7280; --line:#E5E7EB;
  --accent:#2563EB; --accent-ink:#FFFFFF; --accent-fg:var(--accent); --gold:#B45309; --gold-soft:#FEF3C7;
  --ok:#16A34A; --oks:#DCFCE7; --warn:#B45309; --warns:#FEF3C7; --bad:#DC2626; --bads:#FEE2E2;
  --side:#0B0B0F; --side-ink:#FFFFFF; --side-muted:#9CA3AF;
  --shadow:0 1px 2px rgba(11,11,15,.04);
  --f:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B0B0F; --surface:#14151A; --surface-2:#1B1C22; --ink:#F3F4F6; --muted:#9CA3AF; --line:#26272E;
  --gold:#FBBF24; --gold-soft:#2A2410; --ok:#4ADE80; --oks:#11261A; --warn:#FBBF24; --warns:#2A2410; --bad:#F87171; --bads:#2D1517;
  --side:#000000; --side-ink:#F3F4F6; --side-muted:#9CA3AF; --shadow:none; color-scheme:dark;
  --accent-fg:color-mix(in srgb,var(--accent) 55%,#ffffff);
}}
*{box-sizing:border-box} [hidden]{display:none!important} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
.top{background:var(--side);color:var(--side-ink);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dot{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.2rem;flex:none;box-shadow:0 0 0 1px rgba(226,188,85,.5)}
.top h1{margin:0;font-size:1.2rem;line-height:1.3} .top small{color:var(--side-muted)}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 32px;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
h2{margin:0;font-size:1.1rem}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px 6px;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.form{display:grid;gap:12px}
.f{display:grid;gap:5px} .f>span{font-size:.88rem;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:1rem}
.f textarea{min-height:96px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:480px){.g2{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
.btn:disabled{opacity:.55}
.err{color:var(--bad);margin:0;font-size:.9rem}
.done{text-align:center;display:grid;gap:6px}
.done .big{font-size:1.8rem;font-weight:700;letter-spacing:.12em;direction:ltr;color:var(--accent)}
.muted{color:var(--muted)} .sm{font-size:.86rem}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 12px;border-radius:99px}
.p-new{background:var(--warns);color:var(--warn)} .p-review{background:var(--gold-soft);color:var(--gold)} .p-done{background:var(--oks);color:var(--ok)} .p-rejected{background:var(--bads);color:var(--bad)}
.news .it{padding:10px 0;border-top:1px solid var(--line)} .news .it:first-of-type{border-top:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="dot" id="dot">إ</div><div><h1 id="oName">بوابة العملاء</h1><small id="oSub">منظومة إنجاز</small></div></div></header>
<main class="wrap" id="main"><p class="empty">جارٍ التحميل…</p></main>
<script>
const API = 'https://pelkiufonckxdhdlqfas.supabase.co/functions/v1/api';
const SLUG = new URLSearchParams(location.search).get('o') || '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KINDS = { gov: 'جهة حكومية', inst: 'مؤسسة', authority: 'هيئة', company: 'شركة' };
const ST = { new: 'وصل للجهة', review: 'قيد المراجعة', done: 'منجز', rejected: 'مرفوض' };
async function call(action, body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, slug: SLUG, ...body }) });
  const j = await r.json().catch(() => ({ error: 'تعذّر الاتصال' })); if (!r.ok) throw new Error(j.error || 'صار خطأ'); return j;
}
let INFO, TAB = 'req';
function lab(k, d) { return INFO.org.labels?.[k] || d; }
function render() {
  const m = INFO.org.modules || {};
  const forms = INFO.forms || [];
  const tabs = [m.requests && ['req', 'طلب جديد'], m.bookings && INFO.resources.length && ['book', 'حجز موعد'], ...forms.map(f => ['f:' + f.key, f.label]), (m.requests || forms.length) && ['track', 'تابع طلبك']].filter(Boolean);
  if (!tabs.find(t => t[0] === TAB)) TAB = tabs[0]?.[0];
  const F = (l, h) => `<label class="f"><span>${l}</span>${h}</label>`;
  const who = `<div class="g2">${F('الاسم', '<input name="name" autocomplete="name" required>')}${F('رقم الهاتف', '<input name="phone" inputmode="tel" dir="ltr" autocomplete="tel" required>')}</div>`;
  let body = '';
  if (TAB === 'req') body = `<form class="card form" id="fm"><h2>${esc(lab('requests', 'طلب جديد'))}</h2>${who}${F('موضوع الطلب', '<input name="subject" required>')}${F('التفاصيل', '<textarea name="details"></textarea>')}<p class="err" id="er" hidden></p><button class="btn">إرسال الطلب</button><p class="muted sm" style="margin:0">بعد الإرسال يطلع لك رقم الطلب، تتابع فيه الرد من «تابع طلبك».</p></form>`;
  if (TAB === 'book') {
    const t = new Date(); t.setDate(t.getDate() + 1); const d = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    body = `<form class="card form" id="fm"><h2>${esc(lab('bookings', 'حجز موعد'))}</h2>${who}
      ${F('المكان أو الخدمة', `<select name="resource_id">${INFO.resources.map(r => `<option value="${esc(r.id)}">${esc(r.name)}${r.kind ? ' — ' + esc(r.kind) : ''}</option>`).join('')}</select>`)}
      ${F('الغرض', '<input name="subject" required>')}
      <div class="g2">${F('اليوم', `<input type="date" name="day" value="${d}" required>`)}<div class="g2">${F('من', '<input type="time" name="from" value="09:00" required>')}${F('إلى', '<input type="time" name="to" value="10:00" required>')}</div></div>
      <p class="err" id="er" hidden></p><button class="btn">طلب الحجز</button><p class="muted sm" style="margin:0">الحجز يصير مؤكدًا بعد موافقة الجهة.</p></form>`;
  }
  if (TAB && TAB.startsWith('f:')) {
    const fm = forms.find(f => 'f:' + f.key === TAB);
    const inp = x => { const rq = x.req ? ' required' : ''; if (x.t === 'textarea') return `<textarea name="d_${x.k}"${rq}></textarea>`; if (x.t === 'select') return `<select name="d_${x.k}"${rq}><option value="">—</option>${(x.o || []).map(o => `<option>${esc(o)}</option>`).join('')}</select>`; if (x.t === 'yesno') return `<select name="d_${x.k}"${rq}><option value="">—</option><option>نعم</option><option>لا</option></select>`; const ty = { number: 'number', date: 'date', phone: 'tel', email: 'email' }[x.t] || 'text'; return `<input name="d_${x.k}" type="${ty}"${['number', 'phone', 'email'].includes(x.t) ? ' dir="ltr"' : ''}${rq}>`; };
    body = `<form class="card form" id="fm"><h2>${esc(fm.label)}</h2>${who}${fm.fields.map(x => F(esc(x.l) + (x.req ? ' *' : ''), inp(x))).join('')}<p class="err" id="er" hidden></p><button class="btn">إرسال</button><p class="muted sm" style="margin:0">بعد الإرسال يطلع لك رقم، تتابع فيه من «تابع طلبك».</p></form>`;
  }
  if (TAB === 'track') body = `<form class="card form" id="fm"><h2>تابع طلبك</h2><div class="g2">${F('رقم الطلب', '<input name="code" dir="ltr" autocapitalize="characters" required>')}${F('رقم الهاتف', '<input name="phone" inputmode="tel" dir="ltr" required>')}</div><p class="err" id="er" hidden></p><button class="btn">عرض الحالة</button><div id="res"></div></form>`;
  const news = (INFO.news || []).length ? `<section class="card news"><h2 style="margin-bottom:6px">${esc(lab('news', 'آخر الأخبار'))}</h2>${INFO.news.map(n => `<div class="it"><b>${esc(n.title)}</b><div class="muted sm">${esc(n.body || '')}</div></div>`).join('')}</section>` : '';
  const wel = INFO.org.welcome ? `<section class="card" style="white-space:pre-wrap">${esc(INFO.org.welcome)}</section>` : '';
  $('main').innerHTML = wel + (tabs.length > 1 ? `<div class="seg" id="tabs">${tabs.map(([k, l]) => `<button type="button" data-t="${k}" aria-pressed="${k === TAB}">${l}</button>`).join('')}</div>` : '') + (body || '<p class="empty">ما فيه خدمات متاحة حاليًا.</p>') + news;
  if ($('tabs')) $('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { TAB = b.dataset.t; render(); } };
  if ($('fm')) $('fm').onsubmit = submit;
}
async function submit(e) {
  e.preventDefault(); const f = e.target, d = Object.fromEntries(new FormData(f)), btn = f.querySelector('.btn'); btn.disabled = true; $('er').hidden = true;
  try {
    if (TAB === 'req') { const r = await call('portal_submit', d); f.outerHTML = `<section class="card done"><span class="muted">وصل طلبك ✓ رقم الطلب</span><span class="big">${esc(r.code)}</span><span class="muted sm">احفظ الرقم، وتابع الرد من «تابع طلبك» برقم الطلب وهاتفك.</span></section>`; }
    if (TAB === 'book') { await call('portal_submit', { kind: 'booking', name: d.name, phone: d.phone, subject: d.subject, resource_id: d.resource_id, starts: new Date(`${d.day}T${d.from}:00`).toISOString(), ends: new Date(`${d.day}T${d.to}:00`).toISOString() });
      f.outerHTML = `<section class="card done"><span class="big" style="font-size:1.3rem;letter-spacing:0">وصل طلب الحجز ✓</span><span class="muted sm">بيتواصلون معك على رقمك بعد الموافقة.</span></section>`; }
    if (TAB.startsWith('f:')) { const data = {}; for (const [k, v] of Object.entries(d)) if (k.startsWith('d_') && v !== '') data[k.slice(2)] = v;
      const r = await call('portal_submit', { kind: 'form', module: TAB.slice(2), name: d.name, phone: d.phone, data });
      f.outerHTML = `<section class="card done"><span class="muted">وصل ✓ رقم الطلب</span><span class="big">${esc(r.code)}</span><span class="muted sm">احفظ الرقم، وتابع من «تابع طلبك» برقم الطلب وهاتفك.</span></section>`; }
    if (TAB === 'track') { const r = (await call('portal_track', d)).request;
      $('res').innerHTML = `<div class="card" style="box-shadow:none;background:var(--surface-2);border:0"><b>${esc(r.subject)}</b> <span class="pill p-${r.status || 'review'}">${esc(r.status_text || ST[r.status])}</span>${r.reply ? `<p style="margin:8px 0 0;white-space:pre-wrap">${esc(r.reply)}</p>` : '<p class="muted sm" style="margin:6px 0 0">ما وصل رد بعد.</p>'}</div>`; }
  } catch (err) { $('er').textContent = err.message; $('er').hidden = false; }
  finally { if (btn.isConnected) btn.disabled = false; }
}
(async () => {
  try {
    INFO = await call('portal_info', {});
    const o = INFO.org; document.documentElement.style.setProperty('--accent', o.color || '#2563EB');
    $('oName').textContent = o.name; $('oSub').textContent = (KINDS[o.kind] || '') + ' · بوابة العملاء'; $('dot').textContent = o.name.trim()[0] || 'إ';
    if (o.logo) $('dot').outerHTML = `<img src="${o.logo}" alt="" style="width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none">`;
    document.title = o.name + ' — بوابة العملاء'; render();
  } catch (e) { $('main').innerHTML = `<p class="empty">${esc(SLUG ? e.message : 'افتح الرابط اللي أرسلته لك الجهة.')}</p>`; }
})();
</script>
<script src="../../brand/brand.js" data-app="bawaba" defer></script>
</body>
</html>
