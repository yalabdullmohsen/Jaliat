<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام أنشطة الجاليات</title>
<meta name="theme-color" content="#0B3A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أنشطة الجاليات">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed right sidebar (RTL) + working area of panels; drawer slides from the left for forms. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EEF2EE; --ink:#11241D; --muted:#5E6D66; --line:#DDE4DE;
  --primary:#0E6B4E; --primary-ink:#FFFFFF; --primary-soft:#E2F0E8; --gold:#A87A12; --gold-soft:#F6EDD5;
  --side:#0B3A2B; --side-ink:#E8F2EC; --side-muted:#9DBBAE; --side-hi:#145A43;
  --t1:#1F6FA6; --t1s:#E1EDF7; --t2:#6B4BB0; --t2s:#ECE6F7; --t3:#B8601F; --t3s:#F8E9DC;
  --ok:#23845A; --oks:#DFF1E7; --warn:#B07A00; --warns:#FBF0D4; --bad:#B8392B; --bads:#F9E1DD;
  --shadow:0 1px 2px rgba(17,36,29,.06),0 6px 24px rgba(17,36,29,.06); --band:#EAF5EE;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1411; --surface:#131E19; --surface-2:#18261F; --ink:#E5EEE9; --muted:#97AA9F; --line:#24352C;
  --primary:#3DB487; --primary-ink:#06140E; --primary-soft:#163528; --gold:#DDB44C; --gold-soft:#33290F;
  --side:#08120E; --side-ink:#DCEAE2; --side-muted:#7F998C; --side-hi:#163528;
  --t1:#6FB0E3; --t1s:#13283A; --t2:#AE93E8; --t2s:#251D3A; --t3:#E79A5E; --t3s:#3A2414;
  --ok:#55C38E; --oks:#14301F; --warn:#E3B341; --warns:#33290F; --bad:#EE7B6B; --bads:#3A1A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); --band:#16291F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#131E19; --surface-2:#18261F; --ink:#E5EEE9; --muted:#97AA9F; --line:#24352C;
  --primary:#3DB487; --primary-ink:#06140E; --primary-soft:#163528; --gold:#DDB44C; --gold-soft:#33290F;
  --side:#08120E; --side-ink:#DCEAE2; --side-muted:#7F998C; --side-hi:#163528;
  --t1:#6FB0E3; --t1s:#13283A; --t2:#AE93E8; --t2s:#251D3A; --t3:#E79A5E; --t3s:#3A2414;
  --ok:#55C38E; --oks:#14301F; --warn:#E3B341; --warns:#33290F; --bad:#EE7B6B; --bads:#3A1A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); --band:#16291F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(1200px 600px at 85% -10%,var(--primary-soft),transparent 60%),var(--bg)}
.login-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:36px 32px;display:grid;gap:18px;text-align:center}
.lg-form{display:grid;gap:14px;text-align:right}
.lg-form .f{width:100%;font-size:16px;padding:12px 14px}
.login-card .mark{width:64px;height:64px;margin:0 auto;color:var(--primary)}
.login-card .org{color:var(--muted);font-size:13px;margin:0}
.login-card h1{font-size:28px;font-weight:600}
.login-card .dept{margin:-8px 0 0;color:var(--gold);font-weight:600;font-size:14px}
.who{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:12px 14px;text-align:right}
.who img{width:42px;height:42px;border-radius:50%;flex:none}
.who b{display:block;font-size:15px}
.who span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--line)}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-danger{background:var(--bads);color:var(--bad)}
.btn-lg{padding:14px 20px;font-size:16px;border-radius:12px}
.fine{font-size:12.5px;color:var(--muted);margin:0}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:20px 14px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.brand svg{width:34px;height:34px;color:var(--gold);flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block;line-height:1.3}
.brand span{font-size:11.5px;color:var(--side-muted)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);padding:9px 12px;border-radius:9px;text-align:right;font-size:14.5px}
.nav button svg{width:18px;height:18px;opacity:.75;flex:none}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--side-hi);font-weight:600}
.nav button[aria-current="page"] svg{opacity:1;color:var(--gold)}
.nav .sep{font-size:11px;letter-spacing:.06em;color:var(--side-muted);padding:14px 12px 4px}
.side-foot{margin-top:auto;display:grid;gap:10px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.me{display:flex;align-items:center;gap:10px;font-size:13px}
.online{display:grid;gap:4px;font-size:13px;padding-bottom:6px}
.online small{color:var(--side-muted);font-size:11.5px}
.on{display:flex;align-items:center;gap:7px}
.on i{width:8px;height:8px;border-radius:50%;background:#3DB487;box-shadow:0 0 0 3px rgba(61,180,135,.25);flex:none}
.on small{color:var(--side-muted)}
.panel .on{color:var(--ink)} .panel .on small{color:var(--muted)}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--side);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
.me small{display:block;color:var(--side-muted);font-size:11.5px}
.side .btn{background:rgba(255,255,255,.08);color:var(--side-ink);font-size:13.5px;padding:8px 12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h2{font-size:20px;font-weight:600;flex:1;min-width:0}
.top .sub{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:400;display:block}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;align-items:center;justify-content:center}
.view{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.ro{font-size:12px;background:var(--gold-soft);color:var(--gold);padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap}

/* ---------- building blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:15.5px;font-weight:600;flex:1}
.panel-b{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;text-align:right;border-top:3px solid var(--k,var(--primary))}
button.kpi:hover{box-shadow:var(--shadow)}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.t1{background:var(--t1s);color:var(--t1)} .chip.t2{background:var(--t2s);color:var(--t2)} .chip.t3{background:var(--t3s);color:var(--t3)}
.chip.ok{background:var(--oks);color:var(--ok)} .chip.warn{background:var(--warns);color:var(--warn)} .chip.bad{background:var(--bads);color:var(--bad)} .chip.gold{background:var(--gold-soft);color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.t1{background:var(--t1)} .dot.t2{background:var(--t2)} .dot.t3{background:var(--t3)}
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);text-align:right;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.li .time{font-family:var(--f-display);font-size:13px;color:var(--primary);background:var(--primary-soft);padding:4px 10px;border-radius:8px;white-space:nowrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;padding:10px 40px 10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.search svg{position:absolute;right:12px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
select.f,input.f,textarea.f{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
.count{font-size:13px;color:var(--muted);margin-inline-start:auto}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;font-size:12.5px;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td .s{display:block;font-size:12.5px;color:var(--muted)}
.n{font-family:var(--f-display);color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.flag{color:var(--bad);font-weight:700}
/* khatib table — same look as the department's sheet */
.kt th{background:#006C35;color:#fff;text-align:center;font-size:13px;border:1px solid #0b5a30}
.kt td{text-align:center;border:1px solid var(--line);padding:7px 10px;font-size:13.5px}
.kt tbody tr:nth-child(even) td{background:var(--band)}
.kt-title{background:#004D26;color:#fff;text-align:center;padding:12px;font-family:var(--f-display);font-weight:600;font-size:18px;border-radius:var(--r) var(--r) 0 0}
.kt-sub{text-align:center;color:var(--muted);font-size:13px;padding:6px 12px 12px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,180px) 1fr 44px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:12px;border-radius:6px;background:var(--surface-2);display:flex;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--f-display);text-align:left;font-variant-numeric:tabular-nums}
.vbars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:180px;padding-top:10px}
.vbar{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;font-size:12.5px;gap:4px}
.vbar .col{align-self:end;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:right;display:grid;gap:10px}
.ccard:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.ccard h3{font-size:16px;font-weight:600}
.ccard .s{font-size:13px;color:var(--muted)}
.ccard .row{display:flex;gap:6px;flex-wrap:wrap}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 0}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:86px;padding:8px;text-align:right;display:grid;grid-template-rows:auto 1fr auto;gap:4px}
.day.out{opacity:.4}
.day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.day.sel{background:var(--primary-soft)}
.day .d{display:flex;justify-content:space-between;align-items:baseline}
.day .d b{font-family:var(--f-display);font-size:16px}
.day .d small{font-size:11px;color:var(--muted)}
.day .c{font-family:var(--f-display);font-size:13px;color:var(--primary);font-weight:600}
.day .ds{display:flex;gap:3px;flex-wrap:wrap}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.35);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);max-width:100vw;background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.2);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.drawer-h h3{flex:1;font-size:18px;font-weight:600}
.x{background:none;border:0;width:36px;height:36px;border-radius:9px;font-size:22px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.drawer-b{flex:1;overflow:auto;padding:18px 22px;display:grid;gap:16px;align-content:start}
.drawer-f{display:flex;gap:10px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:grid;gap:6px}
.fld label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fld .f{width:100%}
.fld .hint{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13.5px}
.days button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.check{border-radius:10px;padding:12px 14px;font-size:13.5px;display:grid;gap:4px}
.check.ok{background:var(--oks);color:var(--ok)} .check.warn{background:var(--warns);color:var(--warn)} .check.bad{background:var(--bads);color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30;font-weight:600;font-size:14px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 0 0 auto;width:270px;z-index:25;height:auto;transform:translateX(100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .two{grid-template-columns:1fr}
  .day{min-height:58px;padding:5px}.day .d small{display:none}.day .ds{display:none}
  .bar{grid-template-columns:minmax(90px,120px) 1fr 36px}
  .top .btn-primary span{display:none}
}

/* ---------- phones (iPhone) & tablets ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .side.open + .main::before{content:"";position:fixed;inset:0;background:rgba(5,15,10,.35);z-index:24}
  input.f,select.f,textarea.f,.search input{font-size:16px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0 0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:8px 2px 6px;font-size:11px;color:var(--muted)}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--primary);font-weight:600}
  .tabbar .add span.plus{width:42px;height:42px;border-radius:14px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow)}
  .view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #add-act{display:none}
}
@media (max-width:700px){
  .kpis{gap:10px}.kpi{padding:12px 14px}.kpi b{font-size:26px}
  .toolbar select.f{flex:1 1 45%}
  .top h2{font-size:17px}
  table.cardify thead{display:none}
  table.cardify,table.cardify tbody,table.cardify tr,table.cardify td{display:block;width:100%}
  table.cardify tr{border-bottom:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px}
  table.cardify td,table.cardify tbody tr:hover td{border:0;padding:0;background:none}
  table.cardify tbody tr:hover{background:var(--surface-2)}
  table.cardify td:nth-child(1){grid-row:span 2}

function liveCheck(){

async function saveAct(){
  const v = readAct(); const F = S.form;
  if (!v.comm) { toast("اختر الجالية"); $("#f-comm").focus(); return; }
  const ops = [];
  if ($("#f-mos").value === "__new") {
    const name = $("#f-mname").value.trim().replace(/^مسجد\s+/,""), area = $("#f-marea").value.trim();
    if (!name) { toast("اكتب اسم المسجد الجديد"); $("#f-mname").focus(); return; }
    const ex = S.mosques.find(m => nkey(m.name) === nkey(name) && nkey(m.area) === nkey(area));
    if (ex) v.mosque = ex.id; else {
      const nid = "m" + String(Math.max(0, ...S.mosques.map(m => +m.id.slice(1) || 0)) + 1).padStart(3,"0");
      const list = [...S.mosques, {id:nid, name, area, gov:v.gov}]; v.mosque = nid; ops.push(() => T.ref("mosques", list));
    }
  }
  if (v.doc && !docBy[v.doc] && v.start && v.end) { const list = [...S.docs, {no:v.doc, date:v.start, subj:`موافقة ${v.type} — ${v.comm}`, comm:v.comm, start:v.start, end:v.end, notes:""}]; ops.push(() => T.ref("docs", list)); }
  const d = docBy[v.doc]; if (d) { if (v.start === d.start) v.start = ""; if (v.end === d.end) v.end = ""; }
  const n = F.id ? S.acts.get(F.id).n : Math.max(0, ...[...S.acts.values()].map(a => a.n || 0)) + 1;
  const body = { ...v, n };
  try {
    for (const op of ops) await op();
    await T.put("acts", F.id, body);
    closeDrawer(); toast(F.id ? "حُفظ التعديل" : `أُضيف النشاط رقم ${n}`);
  } catch (err) { writeFail(err); }
}
function writeFail(err){
  console.error(err);
  if (err?.code === "42501") toast("لا تملك صلاحية هذه العملية — اطلبها من مدير النظام");
  else if (/fetch|network/i.test(err?.message || "")) toast("لا يوجد اتصال بالإنترنت، حاول مرة أخرى");
  else toast("تعذّر الحفظ، حاول مرة أخرى");
}

  add("المنسقون", S.coords.map(c => ({"الاسم":c.name,"الصفة":c.role,"الجالية":c.comm,"اللغة":c.lang,"الهاتف":c.phone,"الحالة":c.status})));
  add("المساجد", S.mosques.map(m => ({"المسجد":"مسجد " + m.name,"المنطقة":m.area,"المحافظة":m.gov})));
  add("الوثائق", S.docs.map(d => ({"رقم الوثيقة":d.no,"الموضوع":d.subj,"من":fmt(d.start),"إلى":fmt(d.end),"ملاحظات":d.notes})));
  add("الملاحظات", [...S.notes.values()].map(n => ({"التاريخ":fmt(n.date),"العنوان":n.title,"التفاصيل":n.body,"الأولوية":n.prio,"الحالة":n.status,"المصدر":n.src||""})));
  const data = XLSX.write(wb, {type:"array", bookType:"xlsx"});

}

/* ---------------- events ---------------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,tr,[data-open]"); if (!t) { return; }
  if (t.id === "scrim") return;
  const ds = t.dataset;
  if (ds.nav) return go(ds.nav);
  if (ds.go) { if (ds.f) { try { Object.assign(S.f, JSON.parse(ds.f)); } catch(e) {} } return go(ds.go); }
  if (ds.comm) { S.comm = ds.comm; return go("comm"); }
  if (ds.open) { const [k, id] = ds.open.split(":"); return k === "act" ? actForm(id) : k === "kh" ? khForm(id) : k === "note" ? noteForm(id) : listForm(k, k === "co" ? +id : id); }
  if (ds.new) return ds.new === "kh" ? khForm() : ds.new === "note" ? noteForm() : ds.new === "user" ? userForm() : listForm(ds.new);
  if (ds.cal !== undefined) { const c = S.cal; if (ds.cal === "0") { const n = new Date(); S.cal = {y:n.getFullYear(), m:n.getMonth(), sel:TODAY}; } else { const d = new Date(c.y, c.m + +ds.cal, 1); S.cal = {y:d.getFullYear(), m:d.getMonth(), sel:c.sel}; } return render(); }
  if (ds.day) { S.cal.sel = ds.day; return render(); }
  if (ds.close !== undefined) return closeDrawer();
  if (ds.save !== undefined) { const k = S.form?.kind; return k === "act" ? saveAct() : k === "kh" ? saveKh() : k === "note" ? saveNote() : k === "user" ? saveUser() : k === "pass" ? savePass() : saveList(); }
  if (ds.del !== undefined) return delAsk();
  if (ds.delok !== undefined) return doDelete();
  if (ds.type && S.form?.kind === "act" && t.closest("#f-type")) { S.form.type = ds.type; document.querySelectorAll("#f-type button").forEach(b => b.setAttribute("aria-pressed", b.dataset.type === ds.type)); return liveCheck(); }
  if (ds.daily !== undefined && S.form) { S.form.daily = !S.form.daily; t.setAttribute("aria-pressed", S.form.daily); if (S.form.daily) document.querySelectorAll("#f-days [data-d]").forEach(b => b.setAttribute("aria-pressed","false")); return liveCheck(); }

function mdInline(s){

function md(src){
  const lines = esc(src).split("\n"); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      if (body.length) out.push(`<div class="table-wrap"><table><thead><tr>${cells(body[0]).map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { out.push(`<h${Math.min(4, m[1].length + 1)}>${mdInline(m[2])}</h${Math.min(4, m[1].length + 1)}>`); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d+[.)]\s+/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, "")); i++; }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${mdInline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^\s*(-{3,}|_{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^\s*(\||#{1,4}\s|[-*•]\s|\d+[.)]\s)/.test(lines[i])) { para.push(lines[i]); i++; }
    if (para.length) out.push(`<p>${mdInline(para.join("<br>"))}</p>`); else i++;
  }
  return out.join("");
}

function afterRender(v){
  if (v !== "ai") return;
  const log = $("#ai-log"); const inp = $("#ai-in");
  window.scrollTo(0, document.body.scrollHeight);
  if (inp) { const fit = () => { inp.style.height = "auto"; inp.style.height = Math.min(200, inp.scrollHeight) + "px"; }; inp.addEventListener("input", fit);
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("#ai-form").requestSubmit(); } });
    if (matchMedia("(min-width:901px)").matches) inp.focus(); }
  aiStatus().then(st => { const b = $("#ai-setup"); if (b) b.innerHTML = aiSetupHTML(st); });
  void log;
}
async function aiSend(q){
  q = String(q || "").trim(); if (!q || S.ai.busy) return;
  if (S.view !== "ai") go("ai");
  const log = $("#ai-log"); if (!log) return;
  if (!S.chat.length) log.innerHTML = "";
  S.chat.push({ role:"user", content:q }); saveChat();
  log.insertAdjacentHTML("beforeend", msgHTML(S.chat[S.chat.length - 1]) + `<div class="msg a" id="ai-wait">${AI_AV}<div class="bub"><span class="typing"><i></i><i></i><i></i></span> <span class="s">يحلل بيانات القسم…</span></div></div>`);
  const inp = $("#ai-in"); if (inp) { inp.value = ""; inp.style.height = "auto"; }
  window.scrollTo(0, document.body.scrollHeight);
  S.ai.busy = true; $("#ai-send") && ($("#ai-send").disabled = true);
  let res;
  try {
    const msgs = S.chat.filter(m => !m.err).map(m => ({ role:m.role, content:m.content }));
    const { data, error } = await sb.functions.invoke("ai-assistant", { body:{ action:"chat", messages:msgs, context:aiContext(), today:TODAY } });
    if (error) { let m = "تعذّر الاتصال بالمساعد"; try { m = (await error.context.json()).error || m; } catch(e) {} res = { err:true, content:m }; }
    else if (data?.error === "needs_key") { S.ai.status = { ready:false, admin:S.admin }; res = { err:true, content:S.admin ? "المساعد يحتاج التفعيل أولاً — أضف مفتاح التشغيل في المربع أسفل المحادثة." : "المساعد الذكي غير مفعّل بعد. يفعّله مدير النظام." }; const b = $("#ai-setup"); if (b) b.innerHTML = aiSetupHTML(S.ai.status); }
    else if (data?.error) res = { err:true, content:data.error };
    else res = { content:data?.text || "—" };
  } catch(e) { res = { err:true, content:/fetch|network/i.test(e?.message || "") ? "لا يوجد اتصال بالإنترنت" : "تعذّر الاتصال بالمساعد" }; }
  S.ai.busy = false; $("#ai-send") && ($("#ai-send").disabled = false);
  S.chat.push({ role:"assistant", ...res }); saveChat();
  $("#ai-wait")?.remove();
  const lg = $("#ai-log"); if (lg) { lg.insertAdjacentHTML("beforeend", msgHTML(S.chat[S.chat.length - 1], S.chat.length - 1)); }
  if (S.view === "ai" && !$("#ai-new")) $("#ai-send")?.insertAdjacentHTML("afterend", `<button class="btn btn-ghost" type="button" id="ai-new" title="محادثة جديدة">جديدة</button>`);
  window.scrollTo(0, document.body.scrollHeight);
}
async function aiSaveKey(){
  const k = $("#ai-key")?.value.trim(); const er = $("#ai-key-err"); const b = $("#ai-key-save");
  if (!k) return; b.disabled = true; b.textContent = "جارٍ التحقق…"; er.hidden = true;
  try {
    const { data, error } = await sb.functions.invoke("ai-assistant", { body:{ action:"set_key", key:k } });
    let msg = data?.error; if (error) { msg = "تعذّر الحفظ"; try { msg = (await error.context.json()).error || msg; } catch(e) {} }
    if (msg) { er.textContent = msg; er.hidden = false; b.disabled = false; b.textContent = "تفعيل"; return; }
    S.ai.status = { ready:true, admin:true, model:data?.model }; $("#ai-setup").innerHTML = ""; toast("فُعّل المساعد الذكي لكل المستخدمين");
  } catch(e) { er.textContent = "تعذّر الحفظ، حاول مرة أخرى"; er.hidden = false; b.disabled = false; b.textContent = "تفعيل"; }
}
document.addEventListener("submit", ev => { if (ev.target.id === "ai-form") { ev.preventDefault(); aiSend($("#ai-in").value); } });

/* users page: assistant card for the admin */
const _vUsers = vUsers;
vUsers = function(){
  const st = S.ai.status;
  return _vUsers() + `<div class="panel"><div class="panel-h"><h3>المساعد الذكي</h3>${st ? (st.ready ? `<span class="chip ok">مفعّل</span>` : `<span class="chip warn">غير مفعّل</span>`) : ""}<button class="btn btn-ghost" data-go="ai">فتح المساعد</button>${st?.ready ? `<button class="btn btn-ghost" id="ai-key-reset">تغيير المفتاح</button>` : ""}</div>
    <div class="panel-b" style="font-size:14px;color:var(--muted)">${st?.ready ? "يعمل لجميع مستخدمي النظام، بحد أقصى 200 سؤال يومياً لكل مستخدم." : "أضف مفتاح التشغيل من صفحة المساعد الذكي ليعمل لجميع المستخدمين."}</div></div>`;
};

/* ---------- clicks ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,th,a,[data-open]"); if (!t) return;
  const ds = t.dataset;
  if (t.tagName === "A" && ds.open) { ev.preventDefault(); return; }
  if (t.tagName === "TH" && ds.sort) { S.sort = S.sort.k === ds.sort ? { k:ds.sort, asc:!S.sort.asc } : { k:ds.sort, asc:true }; LS.set("sort", S.sort); render(); return; }
  if (ds.wday) { const d = dOf(ds.wday); S.cal = { y:d.getFullYear(), m:d.getMonth(), sel:ds.wday }; return go("cal"); }
  if (t.id === "finder") return openPal();
  if (t.id === "ai-top") return go("ai");
  if (t.id === "theme") return toggleTheme();
  if (t.id === "collapse") return toggleMini();
  if (t.id === "ai-new") { S.chat = []; saveChat(); return render(); }
  if (t.id === "ai-key-save") return aiSaveKey();
  if (t.id === "ai-key-reset") { S.ai.status = { ready:false, admin:true }; return go("ai"); }
  if (ds.aip !== undefined) return aiSend(AI_PROMPTS[+ds.aip][2]);
  if (ds.copy !== undefined) { const m = S.chat[+ds.copy]; if (m) navigator.clipboard?.writeText(m.content).then(() => toast("نُسخ"), () => toast("تعذّر النسخ")); return; }
  if (ds.xf !== undefined) return exportFiltered();
  if (ds.dup !== undefined && S.form?.kind === "act") { const v = readAct(); const ty = S.form.type; closeDrawer(); actForm(undefined, { ...v, type:ty, status:"مجدول" }); toast("نسخة جديدة — عدّل ما يلزم ثم احفظ"); return; }
  if (ds.draft !== undefined) { const dr = LS.get("draft", null); $("#f-draft").innerHTML = ""; if (ds.draft === "1" && dr) fillAct(dr.v); else LS.del("draft"); return; }
  if (ds.fill !== undefined && S.form?.hist) { const h = S.form.hist; const v = { comm:h.comm, gov:h.gov, mosque:h.mosque, time:h.time, type:h.type }; if (!S.form.daily && !S.form.days.size && h.days?.length) Object.assign(v, { days:h.days, daily:h.daily }); fillAct(v); smartBox(""); toast("عُبّئت البيانات من آخر نشاط للمحاضر"); return; }
  if (ds.alt !== undefined && S.form?.alts) { const o = S.form.alts[+ds.alt]; if (o) { fillAct(o.v); toast("طُبّق الموعد البديل"); } return; }
});
document.addEventListener("input", ev => {
  if (!S.form || S.form.kind !== "act" || !$("#drawer").contains(ev.target)) return;
  if (ev.target.id === "f-lect") { clearTimeout(lectSmart.t); lectSmart.t = setTimeout(lectSmart, 250); }
  clearTimeout(saveDraft.t); saveDraft.t = setTimeout(saveDraft, 500);
});
document.addEventListener("change", ev => {
  if (!S.form || S.form.kind !== "act" || !$("#drawer").contains(ev.target)) return;
  if (ev.target.id === "f-doc") docSmart();
  saveDraft();
});

/* ---------- after login ---------- */
function boot9(){ S.ready = true; aiStatus(); }

(async function boot(){
  const { data } = await sb.auth.getSession();
  if (data.session) start(data.session); else showLogin();
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") showLogin(); });
})();
